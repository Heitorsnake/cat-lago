<!DOCTYPE html>
<html>
<head>
<title>catálago de música</title>
<style>
body {
  background-color: #000000;
  color: #ffffff;
  margin: 0;
  min-height: 100vh;
}
h1 {
    font-variant: small-caps;
    font-size: 5rem;
    color: rgb(202, 39, 39);
    text-align: center;
    margin: 40px 0 20px 0;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 8px 18px rgba(202,39,39,0.25), 0 4px 10px rgba(0,0,0,0.75);
}

.bands {
  display: flex;
  justify-content: center;
  gap: 48px;
  margin: 30px auto 60px auto;
  max-width: 1100px;
  align-items: center;
}
.bands img {
  width: 300px;
  height: auto;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  transition: transform .2s ease, box-shadow .2s ease;
}

.bands img:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 8px 18px rgba(0,0,0,0.6);
}

.bands a {
  display: inline-block;
  text-decoration: none;
}

.bands a img {
  display: block;
}

</style>
</head>
<body>
<h1>Bandas de rock</h1>

<div class="bands">

    <img src="https://cdn-images.dzcdn.net/images/cover/e9ad21b4fd509f7ac230970a9f545327/0x1900-000000-80-0-0.jpg" alt="Iron Maiden" title="Iron Maiden — abrir link">
  </a>
  <a href="" target="_blank" rel="noopener noreferrer">

  </a>
  <a href="" target="_blank" rel="noopener noreferrer">
    <img src="https://cdn-images.dzcdn.net/images/cover/4954f43cc6033ddfa0fa3ee5514a26ca/1900x1900-000000-81-0-0.jpg" alt="System Of A Down" title="System Of A Down — abrir link">
  </a>
</div>
</body>
</html>
